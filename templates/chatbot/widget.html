<!-- Floating Circle Chat Trigger Bubble -->
<div class="chatbot-bubble" id="chatbotBubble" title="Chat with Spark AI">
    <i class="fa-solid fa-comment-dots"></i>
</div>

<!-- Chat Window Overlay Panel -->
<div class="chatbot-panel" id="chatbotPanel">
    <!-- Panel Header -->
    <div class="chat-header">
        <div class="chat-header-info">
            <span class="chat-status" aria-label="Online status"></span>
            <h4 class="chat-header-title">Spark <span>AI</span> Assistant</h4>
        </div>
        <button class="chat-close-btn" id="chatCloseBtn" aria-label="Close Chat">&times;</button>
    </div>

    <!-- Message Logs -->
    <div class="chat-body" id="chatBody">
        <div class="chat-message bot">
            <p>Assalam-o-Alaikum! 🏏 I am <strong>Spark AI</strong>, your personal Spark Sports specialist.</p>
            <p style="margin-top: 10px;">Ask me anything about:</p>
            <ul style="margin-left: 15px; margin-top: 5px;">
                <li>Cricket Bat selections</li>
                <li>Product availability & pricing</li>
                <li>Sports nutrition & meal plans</li>
            </ul>
            <p style="margin-top: 10px;">What are you looking to elevate in your game today?</p>
            <div class="chat-message-time">Just now</div>
        </div>
    </div>

    <!-- User Input Controls -->
    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Ask Spark AI..." aria-label="Chat query">
        <button class="chat-send-btn" id="chatSendBtn" aria-label="Send Query">
            <i class="fa-solid fa-paper-plane"></i>
        </button>
    </div>
</div>
